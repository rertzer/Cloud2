- name: "Copy inception directory"
  copy:
    src: inception
    dest: /var/
    owner: "deploy"
    group: "deploy"

- name: "Create nginx conf directory"
  file:
    path: /var/inception/srcs/requirements/nginx/conf
    state: directory
    owner: "deploy"
    group: "deploy"
    mode: "0755"

- name: "Generate .env from template"
  template:
    src: .env.j2
    dest: /var/inception/srcs/.env
    owner: "deploy"
    group: "deploy"
    mode: "0440"

- name: "Generate nginx.conf from template"
  template:
    src: nginx.conf.j2
    dest: /var/inception/srcs/requirements/nginx/conf/nginx.conf
    owner: "deploy"
    group: "deploy"
    mode: "0640"

- name: "Check if mariadb directory exists"
  stat:
    path: /var/data/mariadb
  register: mariadb

- name: "Create mariadb directory"
  file:
    path: /var/data/mariadb
    owner: "deploy"
    group: "deploy"
    mode: "0700"
    state: "directory"
  when: not mariadb.stat.exists

- name: "Check if wordpress directory exists"
  stat:
    path: /var/data/wordpress
  register: wordpress

- name: "Create wordpress directory"
  file:
    path: /var/data/wordpress
    owner: "deploy"
    group: "deploy"
    mode: "0700"
    state: "directory"
  when: not wordpress.stat.exists

- name: "Make Certificate executable"
  file:
    path: /var/inception/srcs/certificate/certif.sh
    mode: "0755"

- name: "Run Certificate Script"
  command:
    cmd: /var/inception/srcs/certificate/certif.sh
    creates: /var/inception/srcs/certificate/maria_ssl/cloud-ca.pem
  args:
    chdir: /var/inception/
